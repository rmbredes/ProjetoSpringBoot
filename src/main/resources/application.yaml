# Agrupa as configurações reconhecidas pelo ecossistema Spring.
spring:
  # Identifica a aplicação em logs, métricas e integrações.
  application:
    # Nome lógico do serviço.
    name: ProjetoSpringBoot

  # Configura a comunicação da aplicação com o Kafka local.
  kafka:
    # Endereço do broker acessível pela aplicação executada fora do Docker.
    bootstrap-servers: localhost:9092

    # Define como o produtor transforma chaves e valores em bytes.
    producer:
      # Serializa a chave textual de cada mensagem.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Serializa o evento Java no formato JSON.
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer

    # Define como os consumers recebem e interpretam as mensagens.
    consumer:
      # Converte os bytes da chave novamente em texto.
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Converte o JSON recebido em um objeto Java.
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      # Começa pelo primeiro registro disponível quando o grupo ainda não possui offset.
      auto-offset-reset: earliest

      # Reúne propriedades adicionais do desserializador JSON.
      properties:
        # Restringe a desserialização aos eventos do pacote conhecido pela aplicação.
        spring.json.trusted.packages: br.com.exemplo.projetospringboot.event

    # Configura o cliente administrativo usado no health check e na criação de tópicos.
    admin:
      # Limita o tempo que o KafkaAdmin espera pela conclusão
      # de uma operação administrativa.
      operation-timeout: 3s

      # Limita o encerramento do cliente administrativo
      # depois da consulta ao Kafka.
      close-timeout: 1s

      # Reúne limites de tempo enviados diretamente ao cliente Kafka.
      properties:
        # Limita o tempo total disponível para uma chamada
        # administrativa realizada pelo cliente Kafka.
        "[default.api.timeout.ms]": 3000

        # Limita o tempo de espera por uma resposta individual
        # enviada ao broker Kafka.
        "[request.timeout.ms]": 3000

    # Habilita observações nos envios realizados pelo KafkaTemplate.
    #
    # O contexto atual será incluído nos headers da mensagem,
    # permitindo sua propagação para os consumers.
    template:
      observation-enabled: true

    # Habilita observações nos containers dos @KafkaListener.
    #
    # Cada consumer extrairá o contexto recebido e criará
    # seu próprio span para o processamento.
    listener:
      observation-enabled: true

  datasource:
    # Como a aplicação está sendo iniciada pelo IntelliJ no Windows,
    # acessamos a porta que o container publicou no computador.
    url: jdbc:postgresql://localhost:5432/projetodb

    # Driver JDBC responsável pela comunicação com o PostgreSQL.
    driver-class-name: org.postgresql.Driver

    # Credenciais locais definidas no serviço postgres do compose.yaml.
    # São valores simples usados apenas no ambiente local de estudo.
    username: postgres
    password: postgres

  # Configura o recebimento de arquivos por requisições multipart.
  servlet:
    multipart:
      # Impede que um único arquivo ultrapasse 10 MB.
      max-file-size: 10MB

      # Permite pequena margem para os demais campos e cabeçalhos
      # existentes na requisição multipart.
      max-request-size: 11MB

  # Configura o JPA e sua implementação Hibernate.
  jpa:
    # Controla a criação e a atualização das tabelas pelas entidades.
    hibernate:
      # Atualiza o esquema sem apagar os dados existentes.
      ddl-auto: update
    # Exibe no terminal os comandos SQL executados.
    show-sql: false
    # Reúne opções específicas do Hibernate.
    properties:
      hibernate:
        # Formata o SQL em várias linhas para facilitar a leitura.
        format_sql: true

# Configura o servidor HTTP incorporado.
server:
  # Porta em que a aplicação recebe as requisições.
  port: 8080
  # Configura o contexto da aplicação web.
  servlet:
    # Prefixo comum de todos os endpoints HTTP.
    context-path: /ProjetoSpringBoot

# Configura os tokens de autenticação da aplicação.
jwt:
  # Chave local usada para assinar e validar os tokens.
  secret: "esta-chave-deve-ser-grande-e-secreta-com-pelo-menos-32-bytes"
  # Mantém o token válido por um dia, em segundos.
  expiration: 86400

# Configura os endpoints operacionais fornecidos pelo Actuator.
management:
  # Reúne as configurações gerais dos endpoints.
  endpoints:
    # Configura a exposição desses endpoints pela web.
    web:
      # Define quais endpoints podem ser acessados por HTTP.
      exposure:
        # Expõe somente os endpoints necessários nesta etapa.
        #
        # Não utilizamos "*" porque outros endpoints podem revelar
        # configurações internas ou informações sensíveis.
        include: health,metrics,prometheus

  # Reúne configurações particulares de cada endpoint.
  endpoint:
    # Personaliza a resposta do endpoint de saúde.
    health:
      # Configurações de health já existentes.
      show-components: when-authorized
      show-details: when-authorized

  # Configura a criação e a exportação dos traces.
  tracing:
    # Define a porcentagem das operações que receberão tracing.
    sampling:
      # Durante o estudo, registra 100% das operações.
      #
      # Em produção normalmente utilizaremos uma porcentagem menor
      # para controlar o volume de dados.
      probability: 1.0
    export:
      otlp:
        # Envia os spans criados pela aplicação para o Jaeger.
        enabled: true

  # Configura o destino da exportação OpenTelemetry.
  opentelemetry:
    tracing:
      export:
        otlp:
          # A aplicação iniciada pela IDE acessa a porta publicada pelo Compose.
          endpoint: http://localhost:4318/v1/traces

  # Desliga o envio de métricas via OTLP
  # enquanto não houver um Collector disponível.
  otlp:
    metrics:
      export:
        enabled: false

# Personaliza o formato dos logs produzidos pela aplicação.
logging:
  # Mantém os logs no console e também em arquivo.
  #
  # O Grafana Alloy acompanhará este arquivo e enviará
  # cada nova linha para o Loki.
  file:
    name: ./logs/projeto-springboot.log

  # Controla o nível mínimo registrado por pacote.
  level:
    # Oculta mensagens informativas internas do cliente Kafka,
    # como a impressão completa do ProducerConfig.
    #
    # Avisos e erros continuarão aparecendo.
    org.apache.kafka: WARN

    # Oculta mensagens informativas sobre atribuição
    # e reatribuição das partições aos listeners.
    org.springframework.kafka.listener.KafkaMessageListenerContainer: WARN

  # Define padrões adicionados às mensagens de log.
  pattern:
    # Inclui no log os identificadores técnicos do trace
    # e o identificador de negócio transportado pelo evento.
    correlation: "[traceId=%X{traceId:-sem-trace} spanId=%X{spanId:-sem-span} eventoId=%X{eventoId:-sem-evento}] "
# Configura as integrações da aplicação com serviços da AWS.
application:
  aws:
    # Configura o armazenamento de anexos no Amazon S3.
    s3:
      # Bucket privado criado para armazenar os anexos dos pedidos.
      #
      # O nome do bucket não é uma senha, mas fica centralizado aqui
      # para não ser repetido nas classes Java.
      bucket-name: recomeco-pedidos-anexos-df33a1eb

      # Região em que o bucket foi criado.
      #
      # O cliente S3 precisa saber a região correta para encaminhar
      # cada requisição ao endpoint apropriado da AWS.
      region: sa-east-1

      # Perfil configurado no arquivo local da AWS CLI.
      #
      # Esse perfil assume a role ProjetoSpringBootS3DevRole,
      # que possui acesso limitado aos objetos dentro de pedidos/*.
      #
      # Quando a aplicação for implantada na AWS, não utilizaremos
      # um perfil local. O ECS fornecerá as credenciais por uma role.
      credentials-profile: projeto-s3

    # Configura o addon responsável pela geração assíncrona
    # de relatórios de pedidos com o Amazon SQS.
    sqs:
      # Permite desligar somente a integração SQS sem afetar
      # Kafka, anexos, S3 ou os demais endpoints da aplicação.
      enabled: true

      # Região onde as filas do laboratório foram criadas.
      region: sa-east-1

      # Endereço completo da fila principal.
      #
      # A aplicação não precisa conhecer a URL da DLQ porque
      # o redirecionamento das falhas é administrado pelo SQS.
      queue-url: https://sqs.sa-east-1.amazonaws.com/033649548808/recomeco-relatorios-pedidos-dev

      # Reutiliza o mesmo perfil temporário já empregado pelo S3.
      # Nenhuma access key ou secret key será armazenada no projeto.
      credentials-profile: projeto-s3

      # Tempo máximo que uma chamada de recebimento aguardará
      # por uma nova mensagem antes de retornar vazia.
      wait-time-seconds: 20

      # Liga o job que consulta e processa mensagens da fila.
      # Pode ser desligado sem impedir que o producer envie mensagens.
      consumer-enabled: true

      # Depois que uma consulta terminar, aguarda cinco segundos
      # antes de iniciar a próxima.
      polling-delay-ms: 5000

      # Fila que recebe do SNS uma cópia de cada evento de relatório.
      audit-queue-url: https://sqs.sa-east-1.amazonaws.com/033649548808/recomeco-auditoria-relatorios-dev

      # Liga separadamente o consumer responsável pela auditoria.
      audit-consumer-enabled: true

      # Intervalo entre as consultas da fila de auditoria.
      audit-polling-delay-ms: 5000

    # Configura o addon que publica eventos no Amazon SNS.
    sns:
      # Permite desligar as notificações sem afetar a geração do PDF,
      # o banco, o S3, o SQS ou os demais recursos da aplicação.
      enabled: true

      # Região onde o tópico foi criado.
      region: sa-east-1

      # ARN do tópico que distribui os eventos de relatório disponível.
      topic-arn: arn:aws:sns:sa-east-1:033649548808:recomeco-eventos-relatorios-dev

      # Reutiliza o perfil temporário já empregado pelo S3 e pelo SQS.
      credentials-profile: projeto-s3
