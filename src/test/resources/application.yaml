# Isola a configuração usada durante a execução dos testes automatizados.
spring:

  # Impede que os consumers Kafka sejam iniciados automaticamente
  # durante a suíte comum de testes.
  kafka:
    listener:
      # Os consumers possuem testes próprios e não precisam
      # acessar um broker Kafka real nesses testes.
      auto-startup: false

  # Configura o recebimento de arquivos por requisições multipart.
  servlet:
    multipart:
      # Impede que um único arquivo ultrapasse 10 MB.
      max-file-size: 10MB

      # Permite pequena margem para os demais campos e cabeçalhos
      # existentes na requisição multipart.
      max-request-size: 11MB

  # Utiliza um PostgreSQL real e descartável durante os testes.
  datasource:
    # O prefixo jdbc:tc solicita que o Testcontainers inicie
    # automaticamente um container PostgreSQL 17.
    #
    # TC_DAEMON mantém o container ativo durante toda a execução
    # do Maven, evitando reinicializações desnecessárias.
    url: jdbc:tc:postgresql:17:///projetodb_test?TC_DAEMON=true

    # Driver intermediário que inicia o container e fornece
    # ao Spring a conexão JDBC do PostgreSQL temporário.
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

    # Credenciais descartáveis usadas apenas dentro do container de teste.
    username: test
    password: test

  # Controla o esquema criado para cada execução da suíte.
  jpa:
    hibernate:
      # Cria as tabelas no início e as remove ao encerrar os testes.
      ddl-auto: create-drop

    # Evita poluir a saída dos testes com comandos SQL.
    show-sql: false


# Usa uma configuração de JWT própria do ambiente de teste.
jwt:
  # Chave previsível usada somente para assinar tokens de teste.
  secret: "esta-chave-deve-ser-grande-e-secreta-com-pelo-menos-32-bytes"
  # Define validade de uma hora para os tokens gerados na suíte.
  expiration: 3600

# Reproduz no teste a configuração operacional do Actuator.
management:
  # Mantém a suíte independente de um servidor Jaeger em execução.
  tracing:
    export:
      otlp:
        enabled: false

  # Desliga também a exportação de métricas no arquivo exclusivo dos testes.
  otlp:
    metrics:
      export:
        enabled: false

  # Configura a exposição dos endpoints.
  endpoints:
    # Aplica as regras à interface HTTP.
    web:
      # Seleciona os endpoints disponíveis durante a suíte.
      exposure:
        # Expõe durante os testes os mesmos endpoints
        # operacionais utilizados pela aplicação.
        #
        # Isso permite testar tanto o conteúdo das métricas
        # quanto as regras de segurança do endpoint Prometheus.
        include: health,metrics,prometheus

  # Configura individualmente o endpoint de saúde.
  endpoint:
    health:
      # Mantém nos testes a mesma política utilizada
      # pela aplicação para exibir os componentes.
      show-components: when-authorized

      # Permite verificar nos testes que somente usuários
      # autenticados recebem detalhes técnicos.
      show-details: when-authorized

  # Controla os indicadores de saúde ativos durante os testes.
  health:
    redis:
      # Impede que a suíte dependa de um Redis externo.
      #
      # O funcionamento real do Redis já foi validado
      # por meio do teste manual realizado anteriormente.
      enabled: false

    kafka:
      # Os testes de integração do Actuator não dependem
      # de um broker Kafka externo.
      #
      # O KafkaHealthIndicator possui testes unitários próprios.
      enabled: false
# Fornece valores seguros para a configuração AWS durante os testes.
#
# Esses valores permitem que o contexto do Spring seja iniciado sem
# depender de credenciais ou de recursos reais da AWS.


# Controla as tarefas executadas automaticamente em intervalos definidos.
app:
  scheduling:
    # Os testes comuns chamam diretamente os métodos que desejam validar.
    #
    # Desligar o agendamento impede que jobs em segundo plano tentem
    # acessar o PostgreSQL temporário enquanto o Hibernate remove as tabelas.
    enabled: false


# Fornece valores seguros e isolados para as integrações
# utilizadas durante os testes automatizados.
application:

  # Configura o contrato Kafka criado para receber
  # os resultados processados pelo pagamento-service.
  kafka:
    pagamentos-processados:
      # Nome fictício. Os listeners permanecem desligados nos testes.
      topic: pagamentos-processados-test

      # Grupo fictício utilizado somente para criar o listener.
      group-id: projeto-springboot-pagamentos-test-group

  # Configura a integração REST com o logistica-service.
  logistica:
    # Impede que o job tente acessar uma aplicação externa
    # durante a suíte automatizada.
    enabled: false

    # O LogisticaClient ainda é criado pelo Spring e precisa
    # receber uma URL válida, embora não realize chamadas.
    base-url: http://localhost:8084

    # Valor necessário para completar a configuração do job,
    # que permanecerá desabilitado neste ambiente.
    polling-delay-ms: 5000

  # Configura valores fictícios para os serviços AWS.
  aws:
    s3:
      # Nome fictício usado pelos testes que não acessam a AWS.
      bucket-name: bucket-ficticio-testes

      # A região precisa ser válida porque AwsS3Config cria um objeto Region.
      region: sa-east-1

      # Mantém o perfil vazio para não depender do computador local.
      credentials-profile: ""

    # Mantém os testes independentes das filas reais.
    sqs:
      enabled: false
      consumer-enabled: false
      audit-consumer-enabled: false

    # Impede publicações reais no SNS.
    sns:
      enabled: false