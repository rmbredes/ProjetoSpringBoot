services:

  app:
    build: .
    container_name: projeto-springboot-container
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:17
    container_name: projeto-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: projetodb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: projeto-redis
    ports:
      - "6379:6379"

volumes:
  postgres-data: